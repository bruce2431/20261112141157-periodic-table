<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>元素周期表 · 化学性质色度/深度交互可视化</title>
  <style>
:root {
  --bg: #0b101e;
  --panel: #131b2e;
  --panel-2: #19233c;
  --border: rgba(148, 163, 184, 0.18);
  --text: #e2e8f0;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --cell-empty: #161f33;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
}
body.light {
  --bg: #f3f6fb;
  --panel: #ffffff;
  --panel-2: #eef2f9;
  --border: rgba(15, 23, 42, 0.12);
  --text: #0f172a;
  --muted: #475569;
  --accent: #0284c7;
  --cell-empty: #e2e8f0;
  --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 18px 22px 32px;
  transition: background 0.25s, color 0.25s;
}
.container { max-width: 1520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 20px;
  box-shadow: var(--shadow);
}
.title-wrap h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.4px; display: flex; align-items: center; gap: 10px; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: rgba(56,189,248,0.16); color: var(--accent); border: 1px solid rgba(56,189,248,0.35); }
.title-wrap p { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.toolbar {
  display: grid; grid-template-columns: 1fr auto; gap: 12px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px;
  box-shadow: var(--shadow);
}
@media (max-width: 1100px) { .toolbar { grid-template-columns: 1fr; } }
.control-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ctrl-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-right: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.seg-group { display: inline-flex; flex-wrap: wrap; background: var(--panel-2); padding: 3px; border-radius: 10px; border: 1px solid var(--border); gap: 3px; }
.btn {
  border: none; background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 500;
  padding: 6px 12px; border-radius: 7px; cursor: pointer; transition: all 0.16s; white-space: nowrap;
}
.btn:hover { color: var(--text); background: rgba(148,163,184,0.12); }
.btn.active { background: var(--accent); color: #06121e; font-weight: 700; box-shadow: 0 2px 8px rgba(56,189,248,0.35); }
body.light .btn.active { color: #ffffff; }
select.ctrl-select, input.ctrl-search {
  background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font-size: 12.5px; outline: none;
}
.legend-bar-wrap {
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px 20px;
  display: grid; grid-template-columns: 240px 1fr 230px; align-items: center; gap: 18px; box-shadow: var(--shadow);
}
@media (max-width: 980px) { .legend-bar-wrap { grid-template-columns: 1fr; } }
.prop-meta .prop-name { font-size: 15px; font-weight: 700; }
.prop-meta .prop-desc { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.grad-box { position: relative; padding: 6px 0 18px; }
.grad-track { height: 16px; border-radius: 8px; border: 1px solid var(--border); width: 100%; position: relative; }
.grad-ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 5px; font-variant-numeric: tabular-nums; }
.grad-pointer {
  position: absolute; top: 1px; width: 3px; height: 26px; background: #fff;
  border: 1px solid #000; border-radius: 2px; transform: translateX(-50%); pointer-events: none;
  opacity: 0; transition: left 0.1s ease-out, opacity 0.15s; z-index: 5;
}
.grad-pointer span {
  position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
  background: #0f172a; color: #fff; font-size: 10.5px; padding: 1px 6px; border-radius: 4px; white-space: nowrap;
}

.main-stage { display: grid; grid-template-columns: 1fr 330px; gap: 16px; align-items: start; }
@media (max-width: 1280px) { .main-stage { grid-template-columns: 1fr; } }
.board-card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
  padding: 18px 16px 20px; box-shadow: var(--shadow); overflow-x: auto;
}
.pt-perspective { transition: transform 0.4s cubic-bezier(.2,.8,.2,1); }
.pt-perspective.relief-3d {
  transform: perspective(1400px) rotateX(22deg) scale(0.97);
  transform-style: preserve-3d;
  padding-top: 14px; padding-bottom: 10px;
}
.pt-grid {
  display: grid;
  grid-template-columns: 26px repeat(18, minmax(48px, 1fr));
  grid-template-rows: 22px repeat(7, 64px) 14px repeat(2, 62px);
  gap: 5px;
  min-width: 980px;
  transform-style: preserve-3d;
}
.axis-lbl {
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; color: var(--muted); user-select: none;
}
.f-slot {
  border: 1px dashed var(--border); border-radius: 8px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 10.5px; color: var(--muted); background: rgba(148,163,184,0.04); cursor: pointer;
}
.f-slot:hover { border-color: var(--accent); color: var(--accent); }
.el-cell {
  position: relative; border-radius: 8px; padding: 4px 5px;
  border: 1px solid rgba(255,255,255,0.14);
  display: flex; flex-direction: column; justify-content: space-between;
  cursor: pointer; user-select: none;
  transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.2s, background 0.25s;
  overflow: hidden;
}
body.light .el-cell { border-color: rgba(15,23,42,0.13); }
.el-cell:hover, .el-cell.selected {
  z-index: 20;
  transform: translateY(-4px) scale(1.09) !important;
  box-shadow: 0 10px 22px rgba(0,0,0,0.5), 0 0 0 2px #fff !important;
}
body.light .el-cell:hover, body.light .el-cell.selected {
  box-shadow: 0 10px 20px rgba(15,23,42,0.25), 0 0 0 2px #0f172a !important;
}
.el-cell.dimmed { opacity: 0.18; filter: grayscale(0.7); }
.el-cell.no-data {
  background: repeating-linear-gradient(-45deg, var(--cell-empty), var(--cell-empty) 5px, rgba(148,163,184,0.09) 5px, rgba(148,163,184,0.09) 10px) !important;
}
.el-top { display: flex; justify-content: space-between; align-items: center; font-size: 9.5px; line-height: 1; opacity: 0.88; font-variant-numeric: tabular-nums; }
.el-mid { display: flex; align-items: baseline; justify-content: center; gap: 3px; margin: 1px 0; }
.el-sym { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.05; }
.el-zh { font-size: 11px; font-weight: 600; opacity: 0.92; }
.el-val { font-size: 9.5px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.depth-fill-bar {
  position: absolute; left: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.75);
  transition: width 0.25s ease; pointer-events: none;
}
.detail-panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
  padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px;
}
.hero-box {
  display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 12px;
  background: var(--panel-2); border: 1px solid var(--border);
}
.hero-tile {
  width: 66px; height: 72px; border-radius: 10px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0;
  border: 1px solid rgba(255,255,255,0.22);
}
.hero-tile .hz { font-size: 11px; opacity: 0.85; }
.hero-tile .hsym { font-size: 24px; line-height: 1.1; }
.hero-tile .hzh { font-size: 12px; }
.prop-list { display: flex; flex-direction: column; gap: 7px; }
.prop-item {
  display: grid; grid-template-columns: 92px 1fr auto; align-items: center; gap: 8px;
  font-size: 12px; padding: 5px 8px; border-radius: 7px; background: var(--panel-2); cursor: pointer;
  border: 1px solid transparent;
}
.prop-item.active-prop { border-color: var(--accent); background: rgba(56,189,248,0.1); }
.prop-bar-bg { height: 6px; background: rgba(148,163,184,0.18); border-radius: 99px; overflow: hidden; }
.prop-bar-fg { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.25s; }
.trend-box { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.trend-title { font-size: 11.5px; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
svg.spark { width: 100%; height: 68px; overflow: visible; display: block; }

</style>
</head>

  <div class="container">
    <header>
      <div class="title-wrap">
        <h1>元素周期表 · 性质色度 / 深度表征系统 <span class="badge">118 Elements · IUPAC</span></h1>
        <p>支持电负性、第一电离能、原子质量、原子半径等 8 项基础化学性质的多光谱色度图、单色明暗深度图与 2.5D 立体高度浮雕切换</p>
      </div>
      <div class="control-row">
        <input id="searchBox" class="ctrl-search" type="text" placeholder="搜索符号 / 中文名 / 英文 / 序数..." />
        <select id="catFilter" class="ctrl-select"></select>
        <button id="btnTheme" class="btn" style="border:1px solid var(--border)">浅色界面</button>
      </div>
    </header>

    <section class="toolbar">
      <div class="control-row">
        <span class="ctrl-label">表征性质</span>
        <div id="propBtns" class="seg-group"></div>
      </div>
      <div class="control-row">
        <span class="ctrl-label">表征模式</span>
        <div class="seg-group">
          <button class="btn active" data-mode-btn="chroma">色度图 (色相光谱)</button>
          <button class="btn" data-mode-btn="depth">深度图 (明暗色深)</button>
          <button class="btn" data-mode-btn="dual">色度+立体深度</button>
          <button class="btn" data-mode-btn="cat">元素分族</button>
        </div>
        <select id="chromaSelect" class="ctrl-select"></select>
        <select id="depthSelect" class="ctrl-select" style="display:none"></select>
        <div class="seg-group">
          <button class="btn active" data-scale-btn="linear">线性映射</button>
          <button class="btn" data-scale-btn="log">对数映射</button>
        </div>
        <button id="btnRelief" class="btn" style="border:1px solid var(--border)">2.5D 浮雕高度</button>
        <button id="btnInvert" class="btn" style="border:1px solid var(--border)">反转高低方向</button>
      </div>
    </section>

    <section class="legend-bar-wrap">
      <div class="prop-meta">
        <div id="propName" class="prop-name">电负性 (Pauling χ)</div>
        <div id="propDesc" class="prop-desc"></div>
      </div>
      <div class="grad-box">
        <div id="gradTrack" class="grad-track">
          <div id="gradPointer" class="grad-pointer"><span></span></div>
        </div>
        <div id="gradTicks" class="grad-ticks"></div>
      </div>
      <div id="statSummary" style="font-size:12px;color:var(--muted);line-height:1.55;text-align:right"></div>
    </section>

    <main class="main-stage">
      <div class="board-card">
        <div id="ptPerspective" class="pt-perspective">
          <div id="ptGrid" class="pt-grid"></div>
        </div>
      </div>

      <aside class="detail-panel">
        <div class="hero-box">
          <div id="heroTile" class="hero-tile"></div>
          <div id="heroInfo"></div>
        </div>
        <div>
          <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px">全性质对比（点击任意行快速切换表征）</div>
          <div id="propList" class="prop-list"></div>
        </div>
        <div class="trend-box">
          <div class="trend-title"><span id="periodTrendLbl">同周期递变趋势</span><span>左 → 右</span></div>
          <svg id="sparkPeriod" class="spark"></svg>
        </div>
        <div class="trend-box">

          <svg id="sparkGroup" class="spark"></svg>
        </div>
      </aside>
    </main>
  </div>

function interpStops(stops, t) {
  const c = Math.max(0, Math.min(1, t));
  const pos = c * (stops.length - 1);
  const i = Math.floor(pos);
  const f = pos - i;
  if (i >= stops.length - 1) return stops[stops.length - 1];
  const a = stops[i], b = stops[i + 1];
  return [
    Math.round(a[0] + (b[0] - a[0]) * f),
    Math.round(a[1] + (b[1] - a[1]) * f),
    Math.round(a[2] + (b[2] - a[2]) * f)
  ];
}

function rgbStr(rgb) { return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`; }

function textContrast(rgb) {
  const lum = (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255;
  return lum > 0.56 ? "#08111f" : "#f8fafc";
}

  chromaMap: "turbo",
  depthMap: "cyan",
  invert: false,
  relief3d: false,

  selectedZ: 9,
  filterCat: -1,
  query: "",
  light: false
};

function currentProp() { return PROPS.find(p => p.key === state.propKey); }

function getStats(prop) {
  const vals = ELEMENTS.map(e => e.raw[prop.idx]).filter(v => v !== null && v !== undefined && !Number.isNaN(v));
  const posVals = vals.filter(v => v > 0);
  const min = Math.min(...vals), max = Math.max(...vals);
  const logMin = posVals.length ? Math.min(...posVals) : 1e-4;
  const sorted = [...vals].sort((a, b) => a - b);
  const med = sorted[Math.floor(sorted.length / 2)];
  return { min, max, logMin, med, count: vals.length };
}

function normVal(val, stats) {
  if (val === null || val === undefined) return null;
  let t;
  if (state.scale === "log") {
    const safeV = Math.max(val, stats.logMin);
    const a = Math.log10(stats.logMin), b = Math.log10(Math.max(stats.max, stats.logMin * 10));
    t = b === a ? 0.5 : (Math.log10(safeV) - a) / (b - a);
  } else {
    t = stats.max === stats.min ? 0.5 : (val - stats.min) / (stats.max - stats.min);
  }
  t = Math.max(0, Math.min(1, t));
  return state.invert ? 1 - t : t;
}

function colorForT(t) {
  if (state.mode === "depth") {
    const dm = DEPTH_MAPS[state.depthMap];
    return interpStops(state.light ? dm.stopsLight : dm.stopsDark, t);
  }
  return interpStops(CHROMA_MAPS[state.chromaMap].stops, t);
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function renderAll() {
  const prop = currentProp();
  const stats = getStats(prop);
  const use3d = state.relief3d || state.mode === "dual";
  document.getElementById("ptPerspective").classList.toggle("relief-3d", use3d);

  const q = state.query.trim().toLowerCase();
  ELEMENTS.forEach(el => {
    const cell = cellDom[el.z];
    const val = el.raw[prop.idx];
    const t = normVal(val, stats);
    const valNode = cell.querySelector(".el-val");
    const barNode = cell.querySelector(".depth-fill-bar");

    const matchQ = !q || el.sym.toLowerCase().includes(q) || el.zh.includes(q) || el.en.toLowerCase().includes(q) || String(el.z) === q;
    const matchCat = state.filterCat === -1 || el.cat === state.filterCat;
    cell.classList.toggle("dimmed", !(matchQ && matchCat));
    cell.classList.toggle("selected", el.z === state.selectedZ);

    if (state.mode === "cat") {
      cell.classList.remove("no-data");
      const rgb = hexToRgb(CATS[el.cat].color);
      cell.style.background = rgbStr(rgb);
      cell.style.color = textContrast(rgb);
      cell.style.transform = "";
      cell.style.boxShadow = "";
      valNode.textContent = val !== null ? prop.fmt(val) : "—";
      barNode.style.width = "0%";
      return;
    }

    if (t === null) {
      cell.classList.add("no-data");
      cell.style.background = "";
      cell.style.color = "var(--muted)";
      cell.style.transform = "";
      cell.style.boxShadow = "";
      valNode.textContent = "暂无";
      barNode.style.width = "0%";
    } else {
      cell.classList.remove("no-data");
      const rgb = colorForT(t);
      cell.style.background = rgbStr(rgb);
      cell.style.color = textContrast(rgb);
      valNode.textContent = prop.fmt(val);
      barNode.style.width = state.mode === "depth" ? `${Math.round(t * 100)}%` : "0%";
      if (use3d) {
        const zLift = Math.round(t * 28);
        const shade = `rgb(${Math.max(0,rgb[0]-55)},${Math.max(0,rgb[1]-55)},${Math.max(0,rgb[2]-55)})`;
        cell.style.transform = `translateZ(${zLift}px) translateY(${-Math.round(t * 6)}px)`;
        cell.style.boxShadow = `0 ${Math.max(2, Math.round(t * 9))}px 0 ${shade}, 0 ${Math.round(t * 16 + 4)}px 14px rgba(0,0,0,0.42)`;
      } else {
        cell.style.transform = "";
        cell.style.boxShadow = "";
      }
    }
  });

  renderLegend(prop, stats);
  renderDetail(EL_BY_Z[state.selectedZ], prop, stats);
  syncToolbarUI();
}

function renderLegend(prop, stats) {
  document.getElementById("propName").textContent = `${prop.name} (${prop.unit})`;
  document.getElementById("propDesc").textContent = prop.desc;
  const track = document.getElementById("gradTrack");
  const ticks = document.getElementById("gradTicks");
  if (state.mode === "cat") {
    track.style.background = `linear-gradient(90deg, ${CATS.map(c => c.color).join(",")})`;
    ticks.innerHTML = `<span>元素化学族分类着色模式（点击右侧图例可筛选单族）</span>`;
    document.getElementById("statSummary").innerHTML = `有效数据：<strong>${stats.count}</strong> / 118 元素`;
    return;
  }
  const samples = [];
  for (let i = 0; i <= 20; i++) samples.push(rgbStr(colorForT(i / 20)));
  track.style.background = `linear-gradient(90deg, ${samples.join(",")})`;
  const tickVals = [0, 0.25, 0.5, 0.75, 1].map(p => {
    const tp = state.invert ? 1 - p : p;
    if (state.scale === "log") {
      const a = Math.log10(stats.logMin), b = Math.log10(Math.max(stats.max, stats.logMin * 10));
      return prop.fmt(Math.pow(10, a + tp * (b - a)));
    }
    return prop.fmt(stats.min + tp * (stats.max - stats.min));
  });
  ticks.innerHTML = tickVals.map(v => `<span>${v}</span>`).join("");
  document.getElementById("statSummary").innerHTML =
    `范围：<strong>${prop.fmt(stats.min)}</strong> ~ <strong>${prop.fmt(stats.max)}</strong> ${prop.unit}<br>中位数：<strong>${prop.fmt(stats.med)}</strong> · 有效值 ${stats.count}/118`;
}

function onHoverElement(el) {
  const prop = currentProp();
  const stats = getStats(prop);
  const val = el.raw[prop.idx];
  const ptr = document.getElementById("gradPointer");
  if (val !== null && state.mode !== "cat") {
    const t = normVal(val, stats);
    ptr.style.left = `${(t * 100).toFixed(1)}%`;
    ptr.style.opacity = "1";
    ptr.querySelector("span").textContent = `${el.sym} ${prop.fmt(val)}`;
  } else {
    ptr.style.opacity = "0";
  }
  renderDetail(el, prop, stats);
}

function hideLegendPointer() {
  document.getElementById("gradPointer").style.opacity = "0";
  const prop = currentProp();
  renderDetail(EL_BY_Z[state.selectedZ], prop, getStats(prop));
}

function drawSparkline(svgId, list, activeZ, prop) {
  const svg = document.getElementById(svgId);
  const pts = list.filter(e => e.raw[prop.idx] !== null);
  if (pts.length < 2) {
    svg.innerHTML = `<text x="50%" y="38" text-anchor="middle" fill="var(--muted)" font-size="11">有效数据点不足</text>`;
    return;
  }
  const vals = pts.map(e => e.raw[prop.idx]);
  const min = Math.min(...vals), max = Math.max(...vals);
  const W = 280, H = 62, padX = 12, padY = 10;
  const coords = pts.map((e, i) => {
    const x = padX + (i / (pts.length - 1)) * (W - padX * 2);
    const ratio = max === min ? 0.5 : (e.raw[prop.idx] - min) / (max - min);
    const y = H - padY - ratio * (H - padY * 2);
    return { e, x, y };
  });
  const poly = coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
  const circles = coords.map(c => {
    const isCur = c.e.z === activeZ;
    return `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${isCur ? 4.5 : 2.4}" fill="${isCur ? "#facc15" : "var(--accent)"}" stroke="${isCur ? "#000" : "none"}" stroke-width="1"/>` +
           (isCur ? `<text x="${c.x.toFixed(1)}" y="${Math.max(10, c.y - 7).toFixed(1)}" text-anchor="middle" fill="var(--text)" font-size="9.5" font-weight="700">${c.e.sym}</text>` : "");
  }).join("");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = `<polyline fill="none" stroke="var(--accent)" stroke-width="1.8" points="${poly}" opacity="0.85"/>${circles}`;
}

function renderDetail(el, activeProp, activeStats) {
  const tile = document.getElementById("heroTile");
  const val = el.raw[activeProp.idx];
  const t = normVal(val, activeStats);
  if (state.mode === "cat" || t === null) {
    const rgb = hexToRgb(CATS[el.cat].color);
    tile.style.background = rgbStr(rgb);
    tile.style.color = textContrast(rgb);
  } else {
    const rgb = colorForT(t);
    tile.style.background = rgbStr(rgb);
    tile.style.color = textContrast(rgb);
  }
  tile.innerHTML = `<span class="hz">${el.z}</span><span class="hsym">${el.sym}</span><span class="hzh">${el.zh}</span>`;
  const periodNum = el.row === 9 ? 6 : (el.row === 10 ? 7 : el.row);
  const groupTxt = el.row >= 9 ? (el.row === 9 ? "镧系 (f区)" : "锕系 (f区)") : `第 ${el.col} 族`;
  document.getElementById("heroInfo").innerHTML = `
    <div style="font-size:15px;font-weight:700">${el.zh} · ${el.en}</div>
    <div style="font-size:12px;color:var(--muted);margin-top:2px">${CATS[el.cat].name} ｜ 第 ${periodNum} 周期 · ${groupTxt}</div>
    <div style="font-size:12px;margin-top:5px;color:var(--accent);font-weight:600">当前 ${activeProp.name}：${val !== null ? activeProp.fmt(val) + " " + activeProp.unit : "暂无实验测定值"}</div>`;

  const listNode = document.getElementById("propList");
  listNode.innerHTML = PROPS.map(p => {
    const st = getStats(p);
    const v = el.raw[p.idx];
    const ratio = v !== null ? Math.max(4, Math.round(((v - st.min) / (st.max - st.min || 1)) * 100)) : 0;
    return `<div class="prop-item ${p.key === state.propKey ? "active-prop" : ""}" data-prop="${p.key}">
      <span>${p.name}</span>
      <div class="prop-bar-bg"><div class="prop-bar-fg" style="width:${ratio}%"></div></div>
      <span style="font-variant-numeric:tabular-nums;font-weight:600">${v !== null ? p.fmt(v) + " " + p.unit : "—"}</span>
    </div>`;
  }).join("");
  listNode.querySelectorAll(".prop-item").forEach(n => {
    n.onclick = () => { state.propKey = n.dataset.prop; renderAll(); };
  });

  const samePeriod = ELEMENTS.filter(e => (e.row === el.row)).sort((a, b) => a.col - b.col);
  const sameGroup = el.row >= 9
    ? ELEMENTS.filter(e => e.col === el.col && e.row >= 9).sort((a, b) => a.row - b.row)
    : ELEMENTS.filter(e => e.col === el.col && e.row <= 7).sort((a, b) => a.row - b.row);
  document.getElementById("periodTrendLbl").textContent = el.row >= 9 ? `${el.row === 9 ? "镧系" : "锕系"}递变趋势` : `第 ${periodNum} 周期递变趋势`;
  document.getElementById("groupTrendLbl").textContent = el.row >= 9 ? "同列f区对比" : `第 ${el.col} 族递变趋势`;
  drawSparkline("sparkPeriod", samePeriod, el.z, activeProp);
  drawSparkline("sparkGroup", sameGroup, el.z, activeProp);
}

function syncToolbarUI() {
  document.querySelectorAll("[data-prop-btn]").forEach(b => b.classList.toggle("active", b.dataset.propBtn === state.propKey));
  document.querySelectorAll("[data-mode-btn]").forEach(b => b.classList.toggle("active", b.dataset.modeBtn === state.mode));
  document.querySelectorAll("[data-scale-btn]").forEach(b => b.classList.toggle("active", b.dataset.scaleBtn === state.scale));
  document.getElementById("chromaSelect").style.display = (state.mode === "chroma" || state.mode === "dual") ? "" : "none";
  document.getElementById("depthSelect").style.display = state.mode === "depth" ? "" : "none";
  document.getElementById("btnRelief").classList.toggle("active", state.relief3d || state.mode === "dual");
  document.getElementById("btnInvert").classList.toggle("active", state.invert);
}

function initUI() {
  const propBar = document.getElementById("propBtns");
  propBar.innerHTML = PROPS.map(p => `<button class="btn" data-prop-btn="${p.key}">${p.name}</button>`).join("");
  propBar.querySelectorAll("button").forEach(b => b.onclick = () => { state.propKey = b.dataset.propBtn; renderAll(); });

  document.querySelectorAll("[data-mode-btn]").forEach(b => b.onclick = () => { state.mode = b.dataset.modeBtn; renderAll(); });
  document.querySelectorAll("[data-scale-btn]").forEach(b => b.onclick = () => { state.scale = b.dataset.scaleBtn; renderAll(); });

  const cs = document.getElementById("chromaSelect");
  cs.innerHTML = Object.entries(CHROMA_MAPS).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join("");
  cs.onchange = () => { state.chromaMap = cs.value; renderAll(); };

  const ds = document.getElementById("depthSelect");
  ds.innerHTML = Object.entries(DEPTH_MAPS).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join("");
  ds.onchange = () => { state.depthMap = ds.value; renderAll(); };

  const catSel = document.getElementById("catFilter");
  catSel.innerHTML = `<option value="-1">全部元素族 (118)</option>` + CATS.map((c, i) => `<option value="${i}">${c.name}</option>`).join("");
  catSel.onchange = () => { state.filterCat = Number(catSel.value); renderAll(); };

  document.getElementById("btnRelief").onclick = () => { state.relief3d = !state.relief3d; renderAll(); };
  document.getElementById("btnInvert").onclick = () => { state.invert = !state.invert; renderAll(); };
  document.getElementById("btnTheme").onclick = () => {
    state.light = !state.light;
    document.body.classList.toggle("light", state.light);
    document.getElementById("btnTheme").textContent = state.light ? "深色界面" : "浅色界面";
    renderAll();
  };
  document.getElementById("searchBox").oninput = e => { state.query = e.target.value; renderAll(); };

  buildGrid();
  renderAll();
}

window.addEventListener("DOMContentLoaded", initUI);

</script>
</body>
</html>
